title: "Twenty years bridging strategy, design, and development"

intro: |
  Hi, I'm Diego Cataldo. I'm a Uruguayan he/him living in Montevideo, Uruguay. Visuals and code are the mediums through which I express myself.

paragraphs:
  - "You can call me a Designer if you want, but I see myself as something more fluid—a hybrid of creator, strategist, and builder. My journey began with graphic design, morphed into crafting physical interfaces for musical instruments, and led me to code my way into digital experiences."
  - "I've shaped design systems for government agencies, mentored aspiring designers at Uruguay's top design school, and brought structure to chaos in fintech products. Whether it's defining a product's soul or digging into the technical guts, I thrive on crossing boundaries."
  - "When I'm not designing, I'm exploring the interplay of art and tech: creative coding, screen printing, or dreaming up visual worlds. I believe great design lives at the messy intersection of logic and feeling—and that's where I do my best work."

more_content:
  - "I hold a degree in Graphic Design and began my career in advertising, working in art direction for audiovisual projects. During those years, I developed a strong foundation in branding, which later became the bridge to product design. That transition started at a design studio collaborating with a musical instrument company specialized in synthesizers. There, I designed the physical interfaces of the instruments, an experience that sparked my interest in product design and interaction. As the work evolved, I also began designing landing pages for these products, which led me to explore how things worked beneath the surface. I started working hands-on with ActionScript, HTML, and CSS, gradually becoming a designer capable of owning projects end to end, from concept and planning to implementation."
  - "My journey then moved into the public sector, where I worked as a consultant for several leading government agencies in Uruguay, including a ten-year collaboration with the National Agency for Research and Innovation (ANII). In this role, I helped define the agency’s product design strategy, built a comprehensive design system, and led the design of key state digital platforms that are still in use today. This work positioned me as an early driver of product design practices at a state level in Uruguay."
  - "Alongside my professional practice, I spent over ten years as a professor in the Design and Visual Communication program at the University of the Republic. I mentored hundreds of students on their final projects, guiding them through the full process, from strategic thinking to final execution. Teaching deeply influenced my approach to leadership, critical thinking, and the evaluation of complex design decisions."
  - "More recently, I've expanded my work internationally, collaborating with U.S. based fintech companies, global organizations like UNESCO, and international institutions such as the Inter-American Development Bank. Across these projects, I’ve led end-to-end design initiatives, from strategy and design systems to frontend implementation, embedding design into complex organizational contexts and helping build digital products for diverse, global audiences."

