<!-- Work Experience Section -->
<section id="experience" class="mb-16">
    <h2 class="text-md text-text-secondary mb-6">Featured experience</h2>

    <div class="space-y-6">
        {% for job in site.data.experience %}
        <!-- Experience Item -->
        <div class="bg-white rounded-2xl p-6 md:p-8 border border-border-light hover:shadow-lg transition-shadow">
            <div class="flex flex-col md:flex-row md:items-start md:justify-between mb-4">
                <div>
                    <h3 class="text-lg font-medium mb-1">{{ job.title }}</h3>
                    <p class="text-lg text-text-secondary">{{ job.company }}</p>
                </div>
                <span class="text-lg text-text-secondary mt-2 md:mt-0">{{ job.period }}</span>
            </div>
            <p class="text-lg text-black/70 mb-4">
                {{ job.description }}
            </p>
            <div class="flex flex-wrap gap-2">
                {% for tag in job.tags %}
                <span class="px-3 py-1 bg-white rounded-full border border-black text-lg font-medium text-black">{{ tag }}</span>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
