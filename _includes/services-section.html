<!-- Services Section -->
<section id="services" class="mb-12 md:mb-16">
    <h2 class="text-sm md:text-md text-text-secondary mb-4 md:mb-6">Services</h2>

    <div class="grid md:grid-cols-3 gap-6 md:gap-6">
        {% for service in site.data.services %}
        <!-- Service Card -->
        <div class="bg-white rounded-2xl p-4 md:p-6 border border-border-light mb-6 md:mb-0">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl {{ service.icon_bg }} flex items-center justify-center mb-3 md:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="{{ service.icon_color }}" class="md:w-5 md:h-5">
                    <path d="{{ service.icon_path }}"></path>
                </svg>
            </div>
            <h3 class="text-base md:text-lg font-medium mb-2">{{ service.title }}</h3>
            <p class="text-black/70 text-sm">
                {{ service.description }}
            </p>
        </div>
        {% endfor %}
    </div>
</section>
