<!-- About Me Section -->
<section id="about" class="mb-12 md:mb-16">
    <h2 class="text-sm md:text-md text-text-secondary mb-4 md:mb-6">About me</h2>

    <div>
        <h3 class="text-2xl md:text-4xl font-medium mb-3 md:mb-4">{{ site.data.about.title }}</h3>
        <p class="text-base md:text-xl text-black/70 leading-relaxed mb-3 md:mb-4">
            {{ site.data.about.intro }}
        </p>
        {% for paragraph in site.data.about.paragraphs %}
        <p class="text-base md:text-xl text-black/70 leading-relaxed mb-3 md:mb-4">
            {{ paragraph }}
        </p>
        {% endfor %}
        <div id="aboutMoreContent" class="hidden mb-6 md:mb-8">
            {% for paragraph in site.data.about.more_content %}
            <p class="text-base md:text-xl text-black/70 leading-relaxed mb-6 md:mb-8">
                {{ paragraph }}
            </p>
            {% endfor %}

            <!-- Skills Tags -->
            <div class="flex flex-wrap gap-2 mt-6 md:mt-10">
                {% for skill in site.data.about.skills %}
                <span class="px-3 py-1 md:px-3 bg-white rounded-full border border-black text-sm md:text-base font-medium text-black/70">{{ skill }}</span>
                {% endfor %}
            </div>
        </div>
        <button id="readMoreBtn" class="text-base md:text-lg text-black leading-relaxed mb-4 md:mb-6 hover:underline mt-8 md:mt-12">
            Read more
        </button>
    </div>
</section>
