<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Cataldo - Full-Stack Designer</title>
    <meta name="description" content="Full-Stack Designer specialized in strategy, design, and development. Creating impactful digital experiences from Montevideo, Uruguay.">

    <link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6, p, a, span, div {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .green-dot-shadow {
            box-shadow: 0 0 0 4px rgba(4, 237, 2, 0.2);
        }

        /* Navigation Active State */
        nav a.nav-link.bg-black {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        /* Rotating Title Animation */
        #rotating-title {
            transition: opacity 0.5s ease-in-out;
        }

        #rotating-title.fade-out {
            opacity: 0;
        }


        /* Light Theme Styles */
        body {
            background-color: #ffffff;
        }

        /* Dark Theme Styles */
        body.dark-theme {
            background-color: #0f0f0f !important;
            color: #ffffff;
        }

        body.dark-theme h1,
        body.dark-theme h2,
        body.dark-theme h3,
        body.dark-theme p {
            color: #ffffff;
        }

        body.dark-theme .text-text-secondary {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        body.dark-theme .text-text-primary {
            color: #ffffff !important;
        }

        .bg-white {
            background-color: #ffffff;
        }

        body.dark-theme .bg-white {
            background-color: #0f0f0f;
        }

        body.dark-theme .border-black {
            border-color: #ffffff;
        }

        body.dark-theme .text-black {
            color: #ffffff;
        }

        body.dark-theme .border-border-light {
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .border-border-medium {
            border-color: rgba(255, 255, 255, 0.2);
        }

        body.dark-theme nav div {
            /* background-color: rgba(0, 0, 0, 0.5) !important; */
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        body.dark-theme nav a.nav-link {
            color: #ffffff !important;
        }

        body.dark-theme nav a.nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        body.dark-theme nav a.nav-link.bg-black {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        body.dark-theme #galleryToggle,
        body.dark-theme #experimentalToggle,
        body.dark-theme #themeToggle {
            background-color: #ffffff;
            color: #000000;
        }

        body.dark-theme #galleryToggle:hover,
        body.dark-theme #experimentalToggle:hover,
        body.dark-theme #themeToggle:hover {
            background-color: #e5e5e5;
        }

        body.dark-theme .bg-black\/20 {
            background-color: rgba(255, 255, 255, 0.2) !important;
        }

        body.dark-theme #readMoreBtn {
            color: #ffffff;
        }

        body.dark-theme img.grayscale {
            filter: grayscale(1) invert(1);
        }

        body.dark-theme .bg-blue-100,
        body.dark-theme .bg-purple-100,
        body.dark-theme .bg-green-100,
        body.dark-theme .bg-orange-100,
        body.dark-theme .bg-red-100,
        body.dark-theme .bg-teal-100,
        body.dark-theme .bg-yellow-100,
        body.dark-theme .bg-pink-100,
        body.dark-theme .bg-gray-100 {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        body.dark-theme .text-black\/70 {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        body.dark-theme .hover\:bg-black\/5:hover {
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        body.dark-theme .bg-black\/5 {
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        body.dark-theme .bg-gradient-to-br {
            filter: brightness(0.3);
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-31X1TYL0TS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-31X1TYL0TS');
    </script>
</head>
<body class="min-h-screen transition-colors duration-300">

    {{ content }}

    <!-- Fixed Bottom Navigation Menu -->
    <nav class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50">
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-full px-3 py-3 shadow-lg">
            <div class="flex items-center gap-2">
                <a href="#about" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    About
                </a>
                <a href="#experience" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Experience
                </a>
                <a href="#projects" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Projects
                </a>
                <a href="#services" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Services
                </a>
                <a href="#awards" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Awards
                </a>
                <a href="#recommendations" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Testimonials
                </a>
                <a href="#contact" class="nav-link px-4 py-2 rounded-full hover:bg-white/20 transition-colors text-md font-medium text-black">
                    Contact
                </a>
                <div class="w-px h-6 bg-black/20 mx-1"></div>
                <button id="galleryToggle" class="w-10 h-10 rounded-full hover:bg-white/20 transition-colors flex items-center justify-center text-black">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M192,48H64A16,16,0,0,0,48,64V192a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64A16,16,0,0,0,192,48Zm0,144H64V64H192V192ZM240,56V200a8,8,0,0,1-16,0V56a8,8,0,0,1,16,0ZM32,56V200a8,8,0,0,1-16,0V56a8,8,0,0,1,16,0Z"></path>
                    </svg>
                </button>
                <button id="experimentalToggle" class="w-10 h-10 rounded-full hover:bg-white/20 transition-colors flex items-center justify-center text-black">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M221.69,199.77,160,96.92V40h8a8,8,0,0,0,0-16H88a8,8,0,0,0,0,16h8V96.92L34.31,199.77A16,16,0,0,0,48,224H208a16,16,0,0,0,13.72-24.23ZM110.86,103.25A7.93,7.93,0,0,0,112,99.14V40h32V99.14a7.93,7.93,0,0,0,1.14,4.11L183.36,167c-12,2.37-29.07,1.37-51.75-10.11-15.91-8.05-31.05-12.32-45.22-12.81ZM48,208l28.54-47.58c14.25-1.74,30.31,1.85,47.82,10.72,19,9.61,35,12.88,48,12.88a69.89,69.89,0,0,0,19.55-2.7L208,208Z"></path>
                    </svg>
                </button>
                <button id="themeToggle" class="w-10 h-10 rounded-full hover:bg-white/20 transition-colors flex items-center justify-center text-black">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Smooth Scroll Script -->
    <script>
        // Rotating Title
        const titles = [
            'Full-Stack Designer',
            'Lead Product Designer',
            'Design Engineer',
            'Frontend Developer',
            'Creative Coder',
            'Visual Artist'
        ];
        let currentIndex = 0;
        const rotatingTitle = document.getElementById('rotating-title');

        function rotateTitle() {
            // Fade out
            rotatingTitle.classList.add('fade-out');

            setTimeout(() => {
                // Change text
                currentIndex = (currentIndex + 1) % titles.length;
                rotatingTitle.textContent = titles[currentIndex];

                // Fade in
                rotatingTitle.classList.remove('fade-out');
            }, 500); // Match the CSS transition duration
        }

        // Rotate every 3 seconds
        setInterval(rotateTitle, 3000);

        // Read More Toggle
        const readMoreBtn = document.getElementById('readMoreBtn');
        const aboutMoreContent = document.getElementById('aboutMoreContent');
        let aboutExpanded = false;

        readMoreBtn.addEventListener('click', () => {
            aboutExpanded = !aboutExpanded;

            if (aboutExpanded) {
                aboutMoreContent.classList.remove('hidden');
                readMoreBtn.textContent = 'Read less';
            } else {
                aboutMoreContent.classList.add('hidden');
                readMoreBtn.textContent = 'Read more';
            }
        });

        // Gallery Toggle
        const galleryToggle = document.getElementById('galleryToggle');
        let galleryOpen = false;

        galleryToggle.addEventListener('click', () => {
            galleryOpen = !galleryOpen;

            // Update button icon
            if (galleryOpen) {
                galleryToggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M32,64a8,8,0,0,1,8-8H216a8,8,0,0,1,0,16H40A8,8,0,0,1,32,64Zm8,48H168a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,24H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Zm-48,40H40a8,8,0,0,0,0,16H168a8,8,0,0,0,0-16Z"></path></svg>';
            } else {
                galleryToggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M192,48H64A16,16,0,0,0,48,64V192a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64A16,16,0,0,0,192,48Zm0,144H64V64H192V192ZM240,56V200a8,8,0,0,1-16,0V56a8,8,0,0,1,16,0ZM32,56V200a8,8,0,0,1-16,0V56a8,8,0,0,1,16,0Z"></path></svg>';
            }
        });

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Check for saved theme preference or default to light mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-theme');
            themeToggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"></path></svg>';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');

            // Save theme preference
            const theme = body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);

            // Update button icon
            if (theme === 'dark') {
                themeToggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"></path></svg>';
            } else {
                themeToggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"></path></svg>';
            }
        });

        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;

                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Highlight active menu item on scroll
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('nav a.nav-link[href^="#"]');

        window.addEventListener('scroll', () => {
            let current = '';

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (scrollY >= (sectionTop - 200)) {
                    current = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('bg-black', 'text-white', '!text-white');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('bg-black', 'text-white', '!text-white');
                }
            });
        });
    </script>

</body>
</html>
